# Stronger noise (typically lower utility, different empirical MIA behaviour).
seed: 42
device: cpu

data:
  path: data/synthetic_ehr_fixture.csv
  test_size: 0.25
  val_size: 0.15
  partition: iid

federated:
  num_clients: 4
  num_global_rounds: 3
  local_epochs: 2
  batch_size: 8
  learning_rate: 0.05
  global_lr: 1.0

dp:
  enabled: true
  l2_clip: 1.0
  noise_multiplier: 1.5

model:
  hidden1: 32
  hidden2: 16
  dropout1: 0.0
  dropout2: 0.0

evaluation:
  run_mia_probe: true
  mia_n_samples: 64

output:
  plots_dir: plots
  results_json: results/dp_high_noise.json
